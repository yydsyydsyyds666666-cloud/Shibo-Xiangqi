// SVG 精确绘制棋盘（动态尺寸 + 主题配色 + 九宫斜线 + 对称楚河汉界）
function drawBoardLine(){
  GX = origin + mw; GY = origin + mw;
  const L = GX, T = GY;
  const R = L + 8*step, B = T + 9*step;
  const W = R + mw, H = B + mw;
  const theme = THEMES[currentTheme];
  // 清除旧网格层与点击层（保留 piecesLayer/fxLayer/checkTip）
  boardDom.querySelectorAll('.board-svg').forEach(n=>n.remove());
  boardDom.querySelectorAll('.point').forEach(n=>n.remove());
  let svg = `<svg width="${W}" height="${H}" style="position:absolute;left:0;top:0;pointer-events:none" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<g stroke="${theme.line}" stroke-width="1.5" stroke-linecap="butt">`;
  for(let y=0;y<=10;y++){
    svg += `<line x1="${L}" y1="${T+y*step}" x2="${R}" y2="${T+y*step}"/>`;
  }
  for(let x=0;x<=8;x++){
    const px = L + x*step;
    svg += `<line x1="${px}" y1="${T}" x2="${px}" y2="${T+4*step}"/>`;
    svg += `<line x1="${px}" y1="${T+5*step}" x2="${px}" y2="${B}"/>`;
  }
  svg += `<line x1="${L+3*step}" y1="${T}" x2="${L+5*step}" y2="${T+2*step}"/>`;
  svg += `<line x1="${L+5*step}" y1="${T}" x2="${L+3*step}" y2="${T+2*step}"/>`;
  svg += `<line x1="${L+3*step}" y1="${T+7*step}" x2="${L+5*step}" y2="${T+9*step}"/>`;
  svg += `<line x1="${L+5*step}" y1="${T+7*step}" x2="${L+3*step}" y2="${T+9*step}"/>`;
  svg += `</g>`;
  // 楚河汉界：大字楷书，列2/列6 关于中线严格对称（字体由 CSS #board text 强制楷体）
  const fs = Math.round(step*0.66);
  const fy = T + 4.5*step + fs*0.34;
  svg += `<text x="${L+2*step}" y="${fy}" font-size="${fs}" fill="${theme.text}" text-anchor="middle">楚河</text>`;
  svg += `<text x="${L+6*step}" y="${fy}" font-size="${fs}" fill="${theme.text}" text-anchor="middle">汉界</text>`;
  // 金属云纹主题：四角回纹装饰
  if(currentTheme === 'metal'){
    const s = step*0.42;
    const corners = [[L,T],[R,T],[L,B],[R,B]];
    for(const [cx,cy] of corners){
      const dx = cx===L ? 1 : -1;
      const dy = cy===T ? 1 : -1;
      svg += `<path d="M${cx+dx*s} ${cy} v${dy*s} h${dx*s} v${-dy*s*0.55} h${dx*s*0.38} v${dy*s*0.28} h${-dx*s*0.38}" fill="none" stroke="${theme.line}" stroke-width="1.4"/>`;
    }
  }
  svg += `</svg>`;
  const svgBox = document.createElement('div');
  svgBox.className = 'board-svg';
  svgBox.innerHTML = svg;
  boardDom.insertBefore(svgBox, piecesLayer);
  for(let y=0;y<=9;y++){
    for(let x=0;x<=8;x++){
      const pointDom = document.createElement('div');
      pointDom.className = "point";
      pointDom.style.left = (L+x*step) + "px";
      pointDom.style.top = (T+y*step) + "px";
      pointDom.onclick = ()=>clickCell(y,x);
      boardDom.insertBefore(pointDom, piecesLayer);
    }
  }
}

// 落子特效（涟漪扩散）
function spawnFx(x, y, type){
  const d = document.createElement('div');
  d.className = 'fx ' + (type || 'move');
  d.style.left = (GX + x*step) + 'px';
  d.style.top = (GY + y*step) + 'px';
  fxLayer.appendChild(d);
  setTimeout(()=>d.remove(), 700);
}

// 合成音效（走棋/吃子/将军/胜负，Web Audio 无外部文件）
function sfx(kind){
  try{
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    function tone(type, f0, f1, dur, vol, delay){
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t+delay);
      o.frequency.exponentialRampToValueAtTime(f1, t+delay+dur);
      g.gain.setValueAtTime(vol, t+delay);
      g.gain.exponentialRampToValueAtTime(0.001, t+delay+dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t+delay); o.stop(t+delay+dur+0.03);
    }
    if(kind==='move'){ tone('triangle', 200, 95, 0.09, 0.5, 0); }
    else if(kind==='capture'){
      // 木棋落子“咚”：柔和低频正弦 + 短泛音，不刺耳
      tone('sine', 240, 95, 0.13, 0.6, 0);
      tone('sine', 480, 190, 0.06, 0.28, 0.004);
    }
    else if(kind==='check'){ tone('square', 660, 660, 0.11, 0.35, 0); tone('square', 880, 880, 0.15, 0.35, 0.13); }
    else if(kind==='win'){ tone('triangle', 400, 820, 0.3, 0.5, 0); tone('triangle', 600, 1240, 0.35, 0.4, 0.18); }
    else if(kind==='lose'){ tone('sawtooth', 300, 110, 0.5, 0.3, 0); }
  }catch(e){}
}

// 中国象棋记谱（近似）：炮二平五 / 马8进7 / 兵七进一
function moveNotation(board, mv){
  const p = board[mv.fy][mv.fx];
  if(!p) return '';
  const type = p.type;
  const isRed = p.color === 0;
  const names = {ju:'车',ma:'马',xiang:'象',shi:'士',jiang:'将',pao:'炮',zu:'卒',juR:'车',maR:'马',xiangR:'相',shiR:'士',shuai:'帅',paoR:'炮',bing:'兵'};
  const name = names[type] || type;
  const col = isRed ? 9 - mv.fx : mv.fx + 1;
  const tcol = isRed ? 9 - mv.tx : mv.tx + 1;
  const cnR = ['一','二','三','四','五','六','七','八','九'];
  const cnB = ['1','2','3','4','5','6','7','8','9'];
  const fromCol = isRed ? cnR[col-1] : cnB[col-1];
  const toCol = isRed ? cnR[tcol-1] : cnB[tcol-1];
  const steps = Math.abs(mv.ty - mv.fy);
  const stepText = isRed ? cnR[steps-1] : String(steps);
  const straight = (type==='ju'||type==='juR'||type==='pao'||type==='paoR'||type==='bing'||type==='zu'||type==='jiang'||type==='shuai');
  if(straight){
    if(mv.ty === mv.fy) return name + fromCol + '平' + toCol;
    const forward = isRed ? (mv.ty < mv.fy) : (mv.ty > mv.fy);
    return name + fromCol + (forward?'进':'退') + stepText;
  }else{
    const forward = isRed ? (mv.ty < mv.fy) : (mv.ty > mv.fy);
    return name + fromCol + (forward?'进':'退') + toCol;
  }
}
function addRecordRaw(color, text){
  if(color === 0){
    moveLog.push({n: moveLog.length + 1, red: text, black: ''});
  }else{
    if(moveLog.length === 0) moveLog.push({n:1, red:'', black:text});
    else moveLog[moveLog.length - 1].black = text;
  }
}
function addRecord(color, text){
  addRecordRaw(color, text);
  updateRecordUI();
}
// 悔棋后按剩余 history 重建棋谱
function rebuildMoveLog(){
  moveLog = [];
  for(const h of history){
    if(h.notation) addRecordRaw(h.turn, h.notation);
  }
  updateRecordUI();
}
function updateRecordUI(){
  // 全量渲染棋谱（不裁剪历史）：框固定大小，内部滚动查看全部记录
  recList.innerHTML = moveLog.map(r=>
    `<div class="rec-row"><span class="rec-n">${r.n}.</span><span class="rec-red">${r.red}</span><span class="rec-black">${r.black}</span></div>`
  ).join('');
  recList.scrollTop = recList.scrollHeight;
}

// 胜率条：评估分 → 双方胜率（平滑）
function updateWinbar(){
  if(!chessData){ return; }
  const d = evaluateBoard(chessData);
  const pBlack = 1 / (1 + Math.pow(10, -d/400));
  const pRed = 1 - pBlack;
  const redPct = playerColor === 0 ? pRed : pBlack;
  winSmooth = winSmooth * 0.6 + redPct * 0.4;
  const pct = Math.round(winSmooth * 100);
  winFill.style.width = pct + '%';
  winText.textContent = '红 ' + pct + '% · 黑 ' + (100 - pct) + '%';
}

function render(){
  drawBoardLine();
  const seen = new Set();
  for(let y=0;y<=9;y++){
    for(let x=0;x<=8;x++){
      const p = chessData[y][x];
      if(!p) continue;
      seen.add(p.id);
      let div = pieceDivs.get(p.id);
      if(!div){
        div = document.createElement("div");
        div.className = "chess-piece "+(p.color===0?"red":"black");
        div.innerText = nameMap[p.type];
        div.style.left = (GX+x*step)+"px";
        div.style.top = (GY+y*step)+"px";
        div.onclick = ()=>clickCell(y,x);
        pieceDivs.set(p.id, div);
        piecesLayer.appendChild(div);
      }else{
        div.style.left = (GX+x*step)+"px";
        div.style.top = (GY+y*step)+"px";
        div.onclick = ()=>clickCell(y,x);
      }
      div.classList.toggle("selected", !!(selected && selected.y === y && selected.x === x));
    }
  }
  // 移除已不在棋盘上的棋子
  for(const [id, div] of pieceDivs){
    if(!seen.has(id)){ div.remove(); pieceDivs.delete(id); }
  }
  // 选中提示点
  piecesLayer.querySelectorAll('.hint').forEach(n=>n.remove());
  if(selected){
    const moves = getValidMove(selected.y, selected.x, chessData);
    moves.forEach(m=>{
      const hint = document.createElement("div");
      hint.className="hint";
      hint.style.left=(GX+m.x*step)+"px";
      hint.style.top=(GY+m.y*step)+"px";
      piecesLayer.appendChild(hint);
    })
  }
  // 落子特效
  if(lastMove){
    spawnFx(lastMove.ty, lastMove.tx, lastMove.captured ? 'capture' : 'move');
    spawnFx(lastMove.fy, lastMove.fx, 'from');
    lastMove = null;
  }
  // 上一步常驻标记
  fxLayer.querySelectorAll('.stepmark').forEach(n=>n.remove());
  if(lastStep){
    const f = document.createElement('div');
    f.className = 'stepmark from';
    f.style.left = (GX + lastStep.fx*step) + 'px';
    f.style.top = (GY + lastStep.fy*step) + 'px';
    fxLayer.appendChild(f);
    const t = document.createElement('div');
    t.className = 'stepmark to';
    t.style.left = (GX + lastStep.tx*step) + 'px';
    t.style.top = (GY + lastStep.ty*step) + 'px';
    fxLayer.appendChild(t);
  }
  updateWinbar();
  updateRecordUI();
}

async function aiMove(){
  if(gameOver || turn !== aiColor) return;
  const myId = gameId;
  const thinkStart = Date.now();
  loadingAnim.style.display = "block";
  msgDom.innerText = "AI思考中...";
  // 先让出主线程一帧：确保"AI思考中"+转圈先渲染出来，再进入耗时的搜索
  await new Promise(r=>setTimeout(r, 30));
  if(myId !== gameId || gameOver){
    loadingAnim.style.display = "none";
    return;
  }
  if(turn !== aiColor){
    // 竞态保护：局面已不在 AI 回合（如中途悔棋/重开），恢复正确提示，绝不卡死
    loadingAnim.style.display = "none";
    msgDom.innerText = (turn === playerColor) ? "轮到你走棋" : "AI思考中...";
    return;
  }
  const allMoves = getAllMoves(chessData, aiColor);
  if(allMoves.length === 0){
    loadingAnim.style.display = "none";
    gameOver = true;
    stopClock();
    msgDom.innerText = "AI无棋可走，你获胜！";
    render();
    return;
  }
  let useMove = null;
  // 走法交由 C 引擎（WASM）：C 侧自带开局定式库 + 迭代加深搜索，JS 不再管开局书
  useMove = await searchBestMove(chessData);
  // 竞态防御：搜索期间可能已重开/悔棋/回选色，放弃本次走棋
  if(myId !== gameId || gameOver){
    loadingAnim.style.display = "none";
    return;
  }
  if(turn !== aiColor){
    loadingAnim.style.display = "none";
    msgDom.innerText = (turn === playerColor) ? "轮到你走棋" : "AI思考中...";
    return;
  }
  if(!useMove){
    useMove = allMoves[0];
  }
    const capturedPiece = chessData[useMove.ty][useMove.tx];
    const notation = moveNotation(chessData, useMove);
    history.push({
      prev: cloneBoard(chessData),
      turn: turn,
      playerColor: playerColor,
      aiColor: aiColor,
      notation: notation
    });
    applyMove(chessData, useMove);
    lastMove = {fy:useMove.fy, fx:useMove.fx, ty:useMove.ty, tx:useMove.tx, captured:!!capturedPiece};
    lastStep = {fy:useMove.fy, fx:useMove.fx, ty:useMove.ty, tx:useMove.tx};
    moveCount += 1;
    repHashes.push(boardHashOf(chessData) >>> 0);
    if(repHashes.length > 12) repHashes.shift();
    if(judgeRepetition()){ return; }
    turn = playerColor;
    resetClockFor(aiColor);
    updateClockUI();
    sfx(capturedPiece ? 'capture' : 'move');
    addRecord(aiColor, notation);
    // 转圈最小可见 550ms：残局/书步搜索太快时也不会"一闪而过"看不见
    const thinkElapsed = Date.now() - thinkStart;
    if(thinkElapsed < 550){
      loadingAnim.style.display = "block";
      msgDom.innerText = "AI思考中...";
      await new Promise(r=>setTimeout(r, 550 - thinkElapsed));
    }
    loadingAnim.style.display = "none";

    if(!findKing(chessData, playerColor)){
      gameOver = true;
      stopClock();
      msgDom.innerText = "AI吃掉将帅，你输了！";
      sfx('lose');
    }else{
      const playerMoves = getAllMoves(chessData, playerColor);
      if(playerMoves.length === 0){
        gameOver = true;
        stopClock();
        const mate = isInCheck(chessData, playerColor);
        msgDom.innerText = mate ? "你被将死，AI获胜！" : "你无棋可走，AI获胜！";
        sfx('lose');
        if(mate) showMateAnim();
      }else if(isInCheck(chessData, playerColor)){
        showCheckAnim();
        msgDom.innerText = "⚠ 你被将军了！轮到你走棋";
      }else{
        msgDom.innerText = "轮到你走棋";
      }
    }
    render();
}

let msgLock = null;
// 三次重复局面 → 判和（终止 AI 无意义循环）
function judgeRepetition(){
  const h = repHashes[repHashes.length - 1];
  let cnt = 0;
  for(let i = 0; i < repHashes.length; i++) if(repHashes[i] === h) cnt++;
  if(cnt >= 3){
    gameOver = true;
    stopClock();
    msgDom.innerText = "三次重复局面，和棋";
    sfx('win');
    render();
    return true;
  }
  return false;
}
function flashMsg(text){
  msgDom.innerText = text;
  clearTimeout(msgLock);
  msgLock = setTimeout(()=>{
    if(gameOver) return;
    if(turn !== playerColor) msgDom.innerText = "AI思考中...";
    else if(isInCheck(chessData, playerColor)) msgDom.innerText = "⚠ 你被将军了！轮到你走棋";
    else msgDom.innerText = "轮到你走棋";
  }, 900);
}

function clickCell(y, x){
  if(gameOver) return;
  if(turn !== playerColor){
    flashMsg("AI思考中，请稍候…");
    return;
  }
  const p = chessData[y][x];
  if(selected){
    const valid = getValidMove(selected.y, selected.x);
    const ok = valid.some(m=>m.y===y && m.x===x);
    if(ok){
      const targetPiece = chessData[y][x];
      const mvObj = {fy:selected.y, fx:selected.x, ty:y, tx:x};
      const notation = moveNotation(chessData, mvObj);
      history.push({
        prev: cloneBoard(chessData),
        turn: turn,
        playerColor: playerColor,
        aiColor: aiColor,
        notation: notation
      });
      applyMove(chessData, mvObj);
      lastMove = {fy:mvObj.fy, fx:mvObj.fx, ty:mvObj.ty, tx:mvObj.tx, captured:!!targetPiece};
      lastStep = {fy:mvObj.fy, fx:mvObj.fx, ty:mvObj.ty, tx:mvObj.tx};
      repHashes.push(boardHashOf(chessData) >>> 0);
      if(repHashes.length > 12) repHashes.shift();
      if(judgeRepetition()){
        selected = null;
        render();
        return;
      }
      if(targetPiece && (targetPiece.type==="jiang" || targetPiece.type==="shuai")){
        gameOver = true;
        stopClock();
        msgDom.innerText = "你吃掉将帅，胜利！";
        sfx('win');
        showMateAnim();
        addRecord(playerColor, notation);
        selected = null;
        render();
        return;
      }
      sfx(targetPiece ? 'capture' : 'move');
      addRecord(playerColor, notation);
      selected = null;
      resetClockFor(playerColor);
      turn = aiColor;
      updateClockUI();
      const aiMoves = getAllMoves(chessData, aiColor);
      if(aiMoves.length === 0){
        gameOver = true;
        stopClock();
        const mate = isInCheck(chessData, aiColor);
        msgDom.innerText = mate ? "将死！你获胜！" : "AI无棋可走，你获胜！";
        sfx('win');
        if(mate) showMateAnim();
        render();
        return;
      }
      if(isInCheck(chessData, aiColor)){
        showCheckAnim();
        msgDom.innerText = "将军！AI 要应手";
      }else{
        msgDom.innerText = "AI思考中...";
      }
      render();
      const myId = gameId;
      setTimeout(()=>{ if(myId===gameId && !gameOver) aiMove(); }, 100);
      return;
    }else{
      if(p && p.color === turn){
        selected = {y,x};
        render();
        return;
      }
      selected = null;
      flashMsg("这步走不了");
      render();
      return;
    }
  }else{
    if(p && p.color === turn){
      selected = {y,x};
      render();
    }else{
      flashMsg(p ? "请先选择己方的棋子" : "请先选择己方的棋子");
    }
  }
}

// ---------- 双方计时器（每步限时制：走完重置，超时判负） ----------
function clockFmt(s){
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}
function updateClockUI(){
  clockRed.querySelector('b').textContent = clockFmt(clockLeft[0]);
  clockBlack.querySelector('b').textContent = clockFmt(clockLeft[1]);
  clockRed.classList.toggle('active', turn === 0 && !gameOver);
  clockBlack.classList.toggle('active', turn === 1 && !gameOver);
}
function clockTick(){
  clockLeft[turn]--;
  if(clockLeft[turn] <= 0){
    clockLeft[turn] = 0;
    updateClockUI();
    gameOver = true;
    stopClock();
    msgDom.innerText = (turn === playerColor ? "你超时" : "AI超时") + "，判负！";
    sfx('win');
    render();
    return;
  }
  updateClockUI();
}
function startClock(){
  stopClock();
  clockTimer = setInterval(clockTick, 1000);
}
function stopClock(){
  if(clockTimer){ clearInterval(clockTimer); clockTimer = null; }
}
function resetClockFor(color){
  clockLeft[color] = clockT;
  updateClockUI();
}

function startGame(color){
  gameId++;
  playerColor = color;
  aiColor = color === 0 ? 1 : 0;
  chessData = initBoardData();
  selected = null;
  turn = 0;
  gameOver = false;
  history = [];
  moveCount = 0;
  repHashes = [];
  loadingAnim.style.display = "none";
  // 清理棋子层/特效层/棋谱/胜率
  piecesLayer.innerHTML = '';
  fxLayer.innerHTML = '';
  pieceDivs.clear();
  moveLog = [];
  winSmooth = 0.5;
  lastMove = null;
  lastStep = null;
  updateRecordUI();
  updateWinbar();
  // 时钟：双方满时开表（当前行动方倒计时）
  clockLeft = [clockT, clockT];
  updateClockUI();
  startClock();

  selectPanel.style.display = "none";
  gamePanel.style.display = "flex";

  if(playerColor === 0){
    msgDom.innerText = "红方先行，轮到你走棋";
  }else{
    msgDom.innerText = "AI思考中...";
    const myId = gameId;
    setTimeout(()=>{ if(myId===gameId && !gameOver) aiMove(); }, 200);
  }
  render();
}
function resetGame(){
  startGame(playerColor);
}
function backToSelect(){
  gameId++;
  stopClock();
  selectPanel.style.display = "flex";
  gamePanel.style.display = "none";
}
function undoMove(){
  if(history.length === 0) return;
  let last = history.pop();
  if(last.turn === aiColor && history.length > 0){
    last = history.pop();
  }
  if(last.turn === aiColor){
    chessData = initBoardData();
    turn = 0;
    moveCount = 0;
    repHashes = [];
    selected = null;
    gameOver = false;
    lastStep = null;
    render();
    rebuildMoveLog();
    // 悔棋回初始：双方时钟满表重启
    clockLeft = [clockT, clockT];
    updateClockUI();
    startClock();
    msgDom.innerText = playerColor === 1 ? "AI思考中..." : "红方先行，轮到你走棋";
    if(playerColor === 1){
      const myId = gameId;
      setTimeout(()=>{ if(myId===gameId && !gameOver) aiMove(); }, 200);
    }
    return;
  }
  chessData = last.prev;
  turn = playerColor;
  selected = null;
  gameOver = false;
  moveCount = history.filter(h=>h.turn===aiColor).length;
  repHashes = [];
  lastStep = null;
  rebuildMoveLog();
  // 悔棋一步：双方时钟满表重启
  clockLeft = [clockT, clockT];
  updateClockUI();
  startClock();
  msgDom.innerText = "轮到你走棋";
  render();
}

// 初始化：计算尺寸、绑定窗口变化
computeBoard();
window.addEventListener('resize', ()=>{
  computeBoard();
  if(chessData) render();
});
